<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>TV for YouTube</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- SF Symbols風アイコン（線幅・角丸キャップを統一） -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <defs>
  <symbol id="i-sidebar" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="3.8"/><path d="M9.6 4.8v14.4M5.8 8.6h1.9M5.8 11.4h1.9M5.8 14.2h1.9"/></g></symbol>
  <symbol id="i-topbar" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="3.2"/><path d="M3.8 9.2h16.4"/></g></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><g fill="currentColor"><circle cx="5.5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18.5" cy="12" r="1.7"/></g></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.8"/><path d="M12 11v5.2"/></g><circle cx="12" cy="7.9" r="1.1" fill="currentColor"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path fill="currentColor" d="M11.1 3.2a1.4 1.4 0 0 1 1.8 0l7.6 6.3c.3.3.5.7.5 1.1V19a2 2 0 0 1-2 2h-3.6a.9.9 0 0 1-.9-.9V15a1.5 1.5 0 0 0-1.5-1.5h-2A1.5 1.5 0 0 0 9.5 15v5.1c0 .5-.4.9-.9.9H5a2 2 0 0 1-2-2v-8.4c0-.4.2-.8.5-1.1z"/></symbol>
  <symbol id="i-flame" viewBox="0 0 24 24"><path fill="currentColor" d="M12.6 2.3c.4 3 2.1 4.4 3.7 6 1.6 1.6 2.7 3.3 2.7 5.700a7 7 0 0 1-14 0c0-2.2.9-3.8 2.2-5 .2 1.3.8 2.1 1.7 2.5-.3-3.7.7-7.1 3.7-9.200z"/></symbol>
  <symbol id="i-library" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="9" width="17" height="11" rx="2.5"/><path d="M6.5 5.500h11M8.5 2.500h7"/></g></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4.8 4.8"/></g></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" d="M7 4.900v14.200c0 1 1.1 1.6 1.9 1.100l11-7.100a1.3 1.3 0 0 0 0-2.200l-11-7.100C8.1 3.3 7 3.9 7 4.900z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" d="m5 12.5 4.5 4.500L19 7"/></symbol>
  <symbol id="i-xmark" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="m6 6 12 12M18 6 6 18"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" d="m9 5 7 7-7 7"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></g></symbol>
 <symbol id="i-down" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="m5 9 7 7 7-7"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><g fill="currentColor"><rect x="6" y="4.5" width="4.2" height="15" rx="1.4"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1.4"/></g></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M14 4h6v6M20 4l-7 7M10 20H4v-6M4 20l7-7"/></symbol>
  <symbol id="i-full" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M4 9V6.5A2.5 2.5 0 0 1 6.5 4H9M15 4h2.500A2.5 2.5 0 0 1 20 6.500V9M20 15v2.500a2.5 2.5 0 0 1-2.5 2.500H15M9 20H6.500A2.5 2.5 0 0 1 4 17.500V15"/></symbol>
  <symbol id="i-pip" viewBox="0 0 24 24"><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="3.2" fill="none"/></g><rect x="12" y="11.5" width="6.5" height="4.5" rx="1.3" fill="currentColor"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="m17 3 3 3-3 3M4 11V9.500A3.5 3.5 0 0 1 7.5 6H20M7 21l-3-3 3-3M20 13v1.500a3.5 3.5 0 0 1-3.5 3.500H4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path fill="currentColor" d="M20.5 14.300A8.5 8.5 0 0 1 9.7 3.500a8.5 8.5 0 1 0 10.8 10.800z"/></symbol>
 <symbol id="i-live" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7.8 7.8a5.9 5.9 0 0 0 0 8.4M16.2 7.8a5.9 5.9 0 0 1 0 8.4M4.8 4.8a10.1 10.1 0 0 0 0 14.400M19.2 4.8a10.1 10.1 0 0 1 0 14.4"/></g><circle cx="12" cy="12" r="2.3" fill="currentColor"/></symbol>
  <symbol id="i-subs" viewBox="0 0 24 24"><g fill="currentColor"><circle cx="9" cy="8" r="3.5"/><path d="M2.6 19.500a6.4 6.4 0 0 1 12.8 0z"/><g opacity=".7"><circle cx="17.2" cy="9" r="2.7"/><path d="M16.8 19.500a5.2 5.2 0 0 1 4.6-5.200c.5 0 .9.3.9.800v4.400z"/></g></g></symbol>
  <symbol id="i-queue" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.500h11M4 11.500h11M4 16.500h6"/><path d="m16.5 14.5 4.5 2.8-4.5 2.800z" fill="currentColor"/></g></symbol>
 <symbol id="i-menu" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 7h16M7 12h10M10 17h4"/></symbol>
  <symbol id="i-clear" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="3.5" width="12.5" height="12.5" rx="3.5"/><rect x="8.5" y="8.5" width="12.5" height="12.5" rx="3.5"/></g></symbol>
  <symbol id="i-tint" viewBox="0 0 24 24"><rect x="3" y="3.5" width="12.5" height="12.5" rx="3.5" fill="currentColor" opacity=".55"/><rect x="8.5" y="8.5" width="12.5" height="12.5" rx="3.5" fill="currentColor"/></symbol>
 <symbol id="i-person" viewBox="0 0 24 24"><g fill="currentColor"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20.500c.6-4.2 3.6-6.5 7.5-6.500s6.9 2.3 7.5 6.500z"/></g></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.500a6.5 6.5 0 0 0 13 0M12 18v3"/></g></symbol>
  <symbol id="i-bookmark" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M7 4h10a1.5 1.5 0 0 1 1.5 1.500V21L12 16.5 5.5 21V5.500A1.5 1.5 0 0 1 7 4z"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.8"/><path d="M12 7v5.200l3.2 2"/></g></symbol>
  <symbol id="i-people" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 19.500a6 6 0 0 1 12 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 14.200a5 5 0 0 1 5 5.3"/></g></symbol>
 <symbol id="i-share" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v11M8.5 7 12 3.5 15.5 7"/><path d="M7.5 10.5h-1a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2h-1"/></g></symbol>
  <symbol id="i-nope" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="8.8"/><path d="M7.5 12h9"/></g></symbol>
  <symbol id="i-sound" viewBox="0 0 24 24"><path fill="currentColor" d="M4 9.5v5h3.500l4.5 3.800V5.700L7.5 9.500z"/><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" d="M15.5 9a4.2 4.2 0 0 1 0 6M18.2 6.500a8 8 0 0 1 0 11"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path fill="currentColor" d="M4 9.500v5h3.500l4.5 3.800V5.700L7.5 9.500z"/><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" d="m16 9.5 5 5M21 9.500l-5 5"/></symbol>
 </defs>
</svg>

<nav class="nav glass" id="nav" aria-label="メイン">
 <span class="ind"></span>
 <button data-act="layout" aria-label="サイドバーを表示"><svg class="ic"><use href="#i-sidebar"/></svg></button>
 <button data-view="home"><svg class="ic ti"><use href="#i-home"/></svg><span class="tl">ホーム</span></button>
 <button data-view="hot"><svg class="ic ti"><use href="#i-flame"/></svg><span class="tl">話題</span></button>
 <button data-view="live"><svg class="ic ti"><use href="#i-live"/></svg><span class="tl">ライブ</span></button>
 <button data-view="subs"><svg class="ic ti"><use href="#i-subs"/></svg><span class="tl">登録</span></button>
 <button data-view="lib"><svg class="ic ti"><use href="#i-library"/></svg><span class="tl">ライブラリ</span></button>
 <button data-view="search" aria-label="検索"><svg class="ic ti"><use href="#i-search"/></svg><span class="tl">検索</span></button>
</nav>

<div class="scrim" id="scrim" data-act="side"></div>
<aside class="side glass" id="side" aria-label="サイドバー">
 <div class="side-h"><button id="sideEdit" class="sedit">編集</button><button data-act="layout" aria-label="タブバーに切り替え"><svg class="ic"><use href="#i-topbar"/></svg></button></div>
 <nav id="sideNav"></nav>
 <button id="sideProf" class="sprof"></button>
</aside>

<h1 id="ptitle"></h1>
<button id="avatar" class="glass" data-act="setup" aria-label="設定"><svg class="ic"><use href="#i-person"/></svg></button>
<main id="main"></main>

<section id="player" aria-label="プレーヤー">
 <div class="wp">
  <div class="pbar">
   <button class="x glass" data-act="mini" aria-label="ミニプレーヤーにする"><svg class="ic"><use href="#i-down"/></svg></button>
   <button class="x glass" data-act="close" aria-label="閉じる"><svg class="ic"><use href="#i-xmark"/></svg></button>
  </div>
  <div class="wcols">
   <div class="wmain"><div id="ytp-wrap"></div><div class="winfo"></div></div>
   <aside class="wrec"></aside>
  </div>
 </div>
 <div class="mbar">
  <span class="grab"></span>
  <button data-act="pp" aria-label="再生/一時停止"><svg class="ic"><use href="#i-pause"/></svg></button>
  <button data-act="expand" aria-label="拡大"><svg class="ic"><use href="#i-expand"/></svg></button>
  <button data-act="close" aria-label="閉じる"><svg class="ic"><use href="#i-xmark"/></svg></button>
 </div>
</section>

<section id="settings" class="sv" aria-label="設定">
 <div class="sv-nav"><button class="back glass" data-back aria-label="戻る"><svg class="ic"><use href="#i-chev"/></svg></button><h1 class="sv-title">設定</h1></div>
 <div class="stk"></div>
</section>
<dialog id="detail" class="sheet"></dialog>
<script type="module" src="app.js"></script>
</body>
</html>
